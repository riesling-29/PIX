name: PIX validation
on:
  push:
    branches: [main, work, 'work-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pix-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,imports]' build
      - run: python -m pytest -q --junitxml=.artifacts/pytest.xml
      - run: python -m build --wheel
      - name: Installed wheel outside checkout
        shell: bash
        run: python tools/validate_usage_wheel.py --wheel dist/*.whl --output .artifacts/wheel
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: python-${{ matrix.os }}-${{ matrix.python }}
          path: .artifacts/
          include-hidden-files: true
          retention-days: 14
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python -m pip install -e '.[dev,browser]'
      - run: node --test tests/viewer/*.cjs
      - run: python -m playwright install --with-deps chromium
      - name: Offline browser flows
        shell: bash
        run: |
          export PIX_RUN_BROWSER=1
          export PIX_PLAYWRIGHT_MODULE="$(python -c 'import pathlib, playwright; print(pathlib.Path(playwright.__file__).parent / "driver/package")')"
          export PIX_COMPARISON_BROWSER_ARTIFACTS="$PWD/.artifacts/browser-comparison"
          python -m pytest tests/browser -q --junitxml=.artifacts/browser-tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-evidence
          path: .artifacts/
          include-hidden-files: true
          retention-days: 14
