    #pix-style-samples .sg-app{background:var(--sg-paper);border:1px solid var(--sg-rule);border-radius:14px;overflow:hidden;}
    #pix-style-samples .sg-header{display:flex;align-items:center;gap:18px;padding:18px 24px;border-bottom:1px solid var(--sg-rule);}
    #pix-style-samples .sg-brand{font-size:21px;letter-spacing:.12em;font-weight:500;color:var(--sg-focus);}
    #pix-style-samples .sg-header-text{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0;}
    #pix-style-samples .sg-eyebrow{font-size:11px;letter-spacing:.1em;color:var(--sg-muted);}
    #pix-style-samples .sg-header-title{font-size:15px;font-weight:500;}
    #pix-style-samples .sg-synthetic{font-size:11px;color:var(--sg-muted);white-space:nowrap;}
    #pix-style-samples .sg-tabs{display:flex;flex-wrap:wrap;gap:0;padding:0 14px;background:var(--sg-chrome);border-bottom:1px solid var(--sg-rule);}
    #pix-style-samples button{font-family:inherit;cursor:pointer;}
    #pix-style-samples .sg-tab{appearance:none;border:0;background:transparent;color:var(--sg-muted);font-size:12px;line-height:1.4;padding:14px 12px;border-bottom:2px solid transparent;}
    #pix-style-samples .sg-tab[aria-pressed=true]{color:var(--sg-ink);border-bottom-color:var(--sg-focus);font-weight:500;}
    #pix-style-samples .sg-toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:19px 24px 13px;}
    #pix-style-samples .sg-toolbar h3{font-size:17px;line-height:1.5;font-weight:500;margin:0;}
    #pix-style-samples .sg-subtitle{font-size:12px;line-height:1.5;margin-top:3px;color:var(--sg-muted);}
    #pix-style-samples .sg-zoom{display:flex;align-items:center;gap:6px;}
    #pix-style-samples .sg-zoom button{background:var(--sg-paper);color:var(--sg-ink);border:1px solid var(--sg-border);border-radius:6px;min-width:34px;min-height:32px;padding:5px 9px;font-size:12px;}
    #pix-style-samples .sg-zoom button:hover{background:var(--sg-chrome);}
    #pix-style-samples .sg-canvas{position:relative;overflow:hidden;min-height:270px;width:100%;background:var(--sg-paper);touch-action:pan-y;cursor:grab;}
    #pix-style-samples .sg-canvas:active{cursor:grabbing;}
    #pix-style-samples .sg-svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:hidden;}
    #pix-style-samples .sg-edge{fill:none;stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-linecap:round;}
    #pix-style-samples .sg-svg text{font-family:inherit;fill:var(--sg-ink);font-weight:400;}
    #pix-style-samples .sg-edge-label{paint-order:stroke;stroke:var(--sg-paper);stroke-width:4px;stroke-linejoin:round;}
    #pix-style-samples .sg-node{position:absolute;appearance:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:0;margin:0;padding:3px;background:var(--sg-paper);border:1px solid var(--sg-border);border-radius:8px;color:var(--sg-ink);box-shadow:0 1px 2px light-dark(#2334450a,#0000001a);}
    #pix-style-samples .sg-node-name{font-size:13px;font-weight:500;line-height:1.12;text-align:center;white-space:nowrap;flex:none;}
    #pix-style-samples .sg-node-value{font-size:11px;color:var(--sg-muted);line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums;flex:none;}
    #pix-style-samples .sg-node:hover{border-color:var(--sg-edge);}
    #pix-style-samples .sg-node[aria-pressed=true]{outline:2px solid var(--sg-focus);outline-offset:3px;}
    #pix-style-samples .sg-legend{padding:13px 24px 15px;display:flex;align-items:center;gap:10px 22px;flex-wrap:wrap;color:var(--sg-muted);font-size:12px;line-height:1.5;}
    #pix-style-samples .sg-legend span{display:inline-flex;align-items:center;gap:7px;}
    #pix-style-samples .sg-swatch{display:inline-block;width:15px;height:3px;background:var(--sg-edge);}
    #pix-style-samples .sg-detail{background:var(--sg-chrome);border-top:1px solid var(--sg-rule);padding:14px 24px;display:flex;align-items:baseline;gap:8px 18px;flex-wrap:wrap;min-height:49px;font-size:12px;line-height:1.6;}

    #pix-style-samples .sg-detail span{color:var(--sg-muted);overflow-wrap:anywhere;}
    #pix-style-samples .sg-event-button{position:absolute;border:0;background:transparent;color:var(--sg-ink);padding:0;margin:0;font-size:13px;font-weight:500;line-height:1.2;}

  <script>
    (()=>{
      const root=document.getElementById('pix-style-samples'),app=root.querySelector('.sg-app');

      const canvas=root.querySelector('.sg-canvas'),art=root.querySelector('.sg-svg'),layer=root.querySelector('.sg-node-layer');
      const designs=[{title:'승인 · 반려 · 재작업',sub:'중립색 노드 · 활동명과 수치의 위계',finish:'neutral'},{title:'Agent 검증과 재시도',sub:'잉크색 곡선 · 간결한 보고서 표현',finish:'ink'},{title:'주문 · 상품 · 택배의 관계',sub:'공유 활동은 중립색 · 객체형은 간선 색으로',finish:'neutral'},{title:'공유 이벤트와 객체별 실행',sub:'객체별 행 · 공유 이벤트의 동일한 위치',finish:'neutral'}];
      const choices={finish:'auto',metrics:true};let current=1,selected=null,scale=1,px=0,py=0,drag=null,lastWidth=0;
      const measureHost=document.createElement('div'),measureCache=new Map();measureHost.setAttribute('aria-hidden','true');measureHost.setAttribute('inert','');measureHost.style.cssText='position:absolute;left:0;top:0;visibility:hidden;pointer-events:none';app.append(measureHost);
      const ns='http://www.w3.org/2000/svg';
      const make=(tag,attrs={})=>{const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));return e;};
      const typeColor=t=>`var(--sg-${({Order:'order',Item:'item',Parcel:'parcel'})[t]||'edge'})`;
      const typeFill=t=>`var(--sg-${({Order:'order',Item:'item'})[t]||'item'}-soft)`;
      const text=(x,y,value,size=12,attrs={})=>{const e=make('text',{x,y,'font-size':size/scale,...attrs});e.textContent=value;return e;};
      function applyFinish(){app.dataset.finish=choices.finish==='auto'?designs[current].finish:choices.finish;}
      function nodeContent(n){const content=document.createDocumentFragment(),name=document.createElement('span');name.className='sg-node-name';name.textContent=n.label;content.append(name);if(choices.metrics){const m=n.metrics.find(m=>m.name==='events')||n.metrics[0];if(m){const value=document.createElement('span');value.className='sg-node-value';value.textContent=`${m.value} ${m.unit==='distinct_events'?'events':m.unit}`;content.append(value);}}return content;}
      function minimumScale(s){if(s.kind!=='graph')return .65;const key=`${s.id}|${app.dataset.finish}|${choices.metrics}`;if(measureCache.has(key))return measureCache.get(key);let floor=.65;for(const n of s.nodes){const probe=document.createElement('button');probe.type='button';probe.className='sg-node';probe.style.cssText='position:static;display:inline-flex;width:max-content;height:auto;max-width:none';probe.append(nodeContent(n));measureHost.append(probe);const bounds=probe.getBoundingClientRect();floor=Math.max(floor,(Math.ceil(bounds.width)+2)/n.width,(Math.ceil(bounds.height)+4)/n.height);probe.remove();}measureCache.set(key,floor);return floor;}
      function center(readable=false){applyFinish();const s=samples[current],w=canvas.clientWidth,floor=minimumScale(s);scale=readable?Math.max(1,floor):Math.max(floor,Math.min(1,(w-36)/s.width));px=s.width*scale<=w?(w-s.width*scale)/2:18;py=24;draw();}
      function select(value){selected=selected===value?null:value;draw();}
      function detail(){const s=samples[current],box=root.querySelector('.sg-detail');let label,description;
        if(selected&&s.kind==='graph'){const n=s.nodes.find(n=>n.id===selected);label=n.label;description=n.metrics.map(m=>`${m.name}: ${m.value} ${m.unit}`).join(' · ');}
        else if(selected){const e=s.events.find(e=>e.id===selected);label=e.label;description=`${e.lane_ids.length}개 객체 · 단계 ${e.start}–${e.end} · ${e.id}`;}
        else if(s.kind==='graph'){label=`${s.nodes.length} activities · ${s.edges.length} relations`;description=canvas.clientWidth<s.width*scale?'좌우로 드래그해 전체 관계 확인 · 노드를 선택하면 상세 수치 표시':'노드를 선택하면 상세 수치 표시 · 관계와 계산값은 동일';}
        else{label=`Variant · ${s.frequency}/${s.population} executions`;description=`${s.lanes.length}개 객체 · ${s.events.length}개 이벤트 · 공유 이벤트를 선택하면 모든 참여 행 강조`;}
        box.querySelector('strong').textContent=label;box.querySelector('span').textContent=description;
      }
      function graph(s,g){
        const selectedEdges=new Set(selected?s.edges.filter(e=>e.source===selected||e.target===selected).map(e=>e.id):[]);
        for(const e of s.edges){const color=e.objectType?typeColor(e.objectType):'var(--sg-edge)';const path=make('path',{d:e.path,class:'sg-edge',stroke:color});if(selectedEdges.has(e.id))path.setAttribute('stroke-width','2.4');g.append(path);if(e.arrowPoints)g.append(make('polygon',{points:e.arrowPoints,fill:color}));if(e.label!==null&&e.label!==''&&e.labelX!==null){g.append(text(e.labelX,e.labelY,e.label,11,{'text-anchor':'middle',class:'sg-edge-label'}));}}
        for(const n of s.nodes){const b=document.createElement('button');b.type='button';b.className='sg-node';b.style.cssText=`left:${px+n.x*scale}px;top:${py+n.y*scale}px;width:${n.width*scale}px;height:${n.height*scale}px`;b.setAttribute('aria-pressed',String(selected===n.id));b.setAttribute('aria-label',`${n.label}. ${n.metrics.map(m=>`${m.name} ${m.value} ${m.unit}`).join('. ')}`);b.append(nodeContent(n));b.addEventListener('click',()=>select(n.id));layer.append(b);}
      }
      function chevrons(s,g){
        const defs=make('defs');g.append(defs);const lanes=new Map(s.lanes.map(l=>[l.id,l]));
        for(const l of s.lanes){g.append(make('rect',{x:l.x,y:l.y,width:l.width,height:l.height,fill:`color-mix(in srgb, ${typeFill(l.object_type)} 38%, var(--sg-paper))`}));g.append(make('rect',{x:15,y:l.y+22,width:4,height:27,rx:2,fill:typeColor(l.object_type)}));g.append(text(l.labelX,l.labelY,l.object_id,12,{'font-weight':500}));g.append(text(l.labelX,l.labelY+18,l.object_type,11,{fill:'var(--sg-muted)'}));}
        g.append(text(20,28,'객체',12,{'font-weight':500}));g.append(text(190,25,'선행 단계',12,{'font-weight':500}));
        for(const slot of s.slots)g.append(text(slot.x,slot.y,slot.label,11,{'text-anchor':'middle',fill:'var(--sg-muted)'}));
        for(let i=0;i<s.events.length;i++){const e=s.events[i],types=[...new Set(e.lane_ids.map(id=>lanes.get(id).object_type))].sort();if(types.length>1){const gradient=make('linearGradient',{id:`sg-shared-${i}`,x1:'0%',x2:'100%'});types.forEach((t,j)=>{gradient.append(make('stop',{offset:`${100*j/types.length}%`,'stop-color':typeFill(t)}),make('stop',{offset:`${100*(j+1)/types.length}%`,'stop-color':typeFill(t)}));});defs.append(gradient);}
          for(const a of s.appearances.filter(a=>a.eventId===e.id)){const lane=lanes.get(a.laneId),fill=types.length>1?`url(#sg-shared-${i})`:typeFill(lane.object_type);const poly=make('polygon',{points:a.points,fill,stroke:typeColor(lane.object_type),'stroke-width':selected===e.id?2.6:1,'vector-effect':'non-scaling-stroke','stroke-linejoin':'round'});g.append(poly);const pts=a.points.split(' ').map(p=>p.split(',').map(Number)),xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);const b=document.createElement('button');b.type='button';b.className='sg-event-button';b.style.cssText=`left:${px+Math.min(...xs)*scale}px;top:${py+Math.min(...ys)*scale}px;width:${(Math.max(...xs)-Math.min(...xs))*scale}px;height:${(Math.max(...ys)-Math.min(...ys))*scale}px`;b.textContent=e.label;b.setAttribute('aria-label',`${e.label}, ${lane.object_id}, 공유 이벤트 ${e.id}`);b.setAttribute('aria-pressed',String(selected===e.id));b.addEventListener('click',()=>select(e.id));layer.append(b);}
        }
      }
      function legend(s){const e=root.querySelector('.sg-legend');e.replaceChildren();const add=(label,color)=>{const v=document.createElement('span');if(color){const sw=document.createElement('i');sw.className='sg-swatch';sw.style.background=color;v.append(sw);}v.append(document.createTextNode(label));e.append(v);};
        if(s.kind==='chevron'){[...new Set(s.lanes.map(l=>l.object_type))].sort().forEach(t=>add(t,typeColor(t)));add('폭: 선행 단계 · 소요시간 아님');add('분할 색: 공유 이벤트의 참여 객체형');}
        else{const types=[...new Set(s.edges.map(e=>e.objectType).filter(Boolean))].sort();types.forEach(t=>add(t,typeColor(t)));if(!types.length)add('간선 수치: 전이 횟수');else add('활동 노드는 여러 객체형이 공유');add('선 굵기: 빈도 미반영');}
      }
      function draw(){const s=samples[current],d=designs[current];applyFinish();const floor=minimumScale(s);if(scale<floor){const cx=canvas.clientWidth/2;px=cx-(cx-px)*floor/scale;py=24+(py-24)*floor/scale;scale=floor;}const height=Math.max(270,Math.min(520,s.height*scale+52));canvas.style.height=height+'px';art.replaceChildren();layer.replaceChildren();art.setAttribute('viewBox',`0 0 ${canvas.clientWidth} ${height}`);art.setAttribute('aria-label',`${d.title}. ${s.kind==='graph'?s.nodes.length+' activities, '+s.edges.length+' relations':s.events.length+' events in '+s.lanes.length+' object lanes'}`);const g=make('g',{transform:`translate(${px} ${py}) scale(${scale})`});art.append(g);if(s.kind==='graph')graph(s,g);else chevrons(s,g);root.querySelector('[data-action="minus"]').disabled=scale<=floor+.00001;root.querySelector('[data-action="plus"]').disabled=scale>=Math.max(1.6,floor)-.00001;legend(s);detail();}
      function change(index){current=index;selected=null;root.querySelectorAll('.sg-tab').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.case)===index)));root.querySelector('.sg-title').textContent=designs[index].title;root.querySelector('.sg-subtitle').textContent=designs[index].sub;center();}
      root.querySelectorAll('[data-case]').forEach(b=>b.addEventListener('click',()=>change(Number(b.dataset.case))));
      root.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.action;if(a==='overview'||a==='readable'){center(a==='readable');return;}const floor=minimumScale(samples[current]),next=Math.max(floor,Math.min(Math.max(1.6,floor),scale*(a==='plus'?1.2:1/1.2)));const cx=canvas.clientWidth/2,cy=canvas.clientHeight/2;px=cx-(cx-px)*next/scale;py=cy-(cy-py)*next/scale;scale=next;draw();}));
      canvas.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,px,py};canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(!drag)return;px=drag.px+e.clientX-drag.x;py=drag.py+e.clientY-drag.y;draw();});const stop=()=>{drag=null;};canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);
      change(1);new ResizeObserver(()=>{if(canvas.clientWidth!==lastWidth){lastWidth=canvas.clientWidth;center();}}).observe(canvas);
      if(document.fonts){const refresh=()=>{measureCache.clear();draw();};document.fonts.ready.then(refresh);document.fonts.addEventListener('loadingdone',refresh);}
      if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:draw});tweak.addSelect(choices,'finish',{label:'표현',options:[{label:'샘플별 추천',value:'auto'},{label:'중립색 분석',value:'neutral'},{label:'잉크색 보고서',value:'ink'}]});tweak.addToggle(choices,'metrics',{label:'노드 수치 표시'});}
